<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f2f2f2;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* IMAGE GALLERY */
    .gallery-wrapper {
      width: 100%;
      text-align: center;
    }

    .main-image-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto 15px auto;
    }

    .main-image-container img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #ccc;
      object-fit: cover;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 32px;
      background: rgba(0,0,0,0.4);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .arrow.left { left: -10px; }
    .arrow.right { right: -10px; }

    .thumb-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .thumb-row img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .thumb-selected {
      border-color: black !important;
    }

    h1 { margin-bottom: 10px; }

    .price {
      font-size: 1.7rem;
      font-weight: bold;
      margin: 5px 0 20px 0;
    }

    /* CHECKOUT */
    .checkout-box {
      margin-top: 30px;
      padding: 20px;
      background: #fafafa;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    label { display: block; margin-bottom: 5px; font-weight: bold; }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      background: black;
      color: white;
    }

    /* MOBILE FRIENDLY */
    @media (max-width: 600px) {
      .arrow.left { left: 5px; }
      .arrow.right { right: 5px; }
      .thumb-row img { width: 65px; height: 65px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <h1 id="title">Product Title Here</h1>
    <p class="price" id="price">$850.00</p>

    <!-- IMAGE GALLERY -->
    <div class="gallery-wrapper">
      <div class="main-image-container">
        <span class="arrow left" onclick="prevImg()">&#10094;</span>
        <img id="main-img" src="https://via.placeholder.com/600" />
        <span class="arrow right" onclick="nextImg()">&#10095;</span>
      </div>

      <div class="thumb-row" id="thumb-row">
        <img src="https://via.placeholder.com/600" onclick="selectImg(0)" class="thumb-selected" />
        <img src="https://via.placeholder.com/600/ff0000" onclick="selectImg(1)" />
        <img src="https://via.placeholder.com/600/00ff00" onclick="selectImg(2)" />
      </div>
    </div>

    <!-- DESCRIPTION -->
    <p id="description" style="margin-top:20px;">This is your product description. You can edit this anytime.</p>

    <!-- BUY BUTTON -->
    <button onclick="startCheckout()" style="margin-top:25px;">Buy Now</button>

  </div>

<script>
let images = [
  "https://via.placeholder.com/600",
  "https://via.placeholder.com/600/ff0000",
  "https://via.placeholder.com/600/00ff00"
];

let currentIndex = 0;

function updateMain() {
  document.getElementById("main-img").src = images[currentIndex];
  [...document.querySelectorAll('#thumb-row img')].forEach((img,i)=>{
    img.classList.toggle('thumb-selected', i === currentIndex);
  });
}

function selectImg(i) {
  currentIndex = i;
  updateMain();
}
function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  updateMain();
}
function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateMain();
}

function startCheckout() {
  window.location.href = "https://buy.stripe.com/test_placeholder";
}
</script>

<div class="container" style="margin-top:20px;">
    <h2>Have a Question?</h2>
    <p>Send me a message directly:</p>
    <form id="questionForm" action="https://formspree.io/f/mjkvzqwe" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Ask your question here..." style="width:100%;height:120px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:1rem;resize:vertical;" required></textarea>
      <button type="submit">Send Question</button>
      <p id="successMsg" style="display:none;margin-top:10px;color:green;font-weight:bold;">Thanks for reaching out— you'll hear from us soon.</p>
    </form>

<script>
const qForm = document.getElementById('questionForm');
qForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(qForm);
  const response = await fetch(qForm.action, {
    method: 'POST',
    body: formData,
    headers: { 'Accept': 'application/json' }
  });
  if (response.ok) {
    document.getElementById('successMsg').style.display = 'block';
    qForm.reset();
  }
});
</script>
  </div>

</body>
</html>
